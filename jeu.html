<!DOCTYPE html>
<html lang="fr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeux</title>
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="game-body">
    <nav id="navbar">
        <div class="logo"><img src="images/main.svg" alt="Logo AfriConnect" class="logo-image"></div>
        <div class="menu-toggle" id="mobile-menu">☰</div>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="programme.html">Programme</a></li>
            <li><a href="intervenants.html">Intervenants</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="jeu.html" class="special-link">Mini-Jeu</a></li>
        </ul>
        <button id="theme-toggle">🌙</button>
    </nav>
    <div class="glass-container" id="game-container">
        <div id="welcome-screen">
            <h1>Attrape la bulle !</h1>
            <p>Entre ton pseudo pour commencer l’aventure.</p>
            <div class="welcome-form">
                <input type="text" id="player-name" placeholder="Ton pseudo" maxlength="20" />
                <button id="start-game-btn">Commencer</button>
            </div>
        </div>

        <div id="game-screen" hidden>
            <h1>Attrape la bulle !</h1>
            <p id="welcome-message"></p>
            <p>Score: <span id="score">0</span></p>
            <div id="game-area">
                <div id="target-bubble" class="liquid-glass"></div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
